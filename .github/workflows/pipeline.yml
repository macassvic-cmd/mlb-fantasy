name: MLB Fantasy Pipeline

# All cron times are UTC. The MLB season runs in PDT (UTC-7) Apr–Oct.
#
# CRON STRATEGY (updated 2026-08-31):
# ─────────────────────────────────────────────────────────────────────────────
# GitHub crons are delayed 0.2–6.8h (avg 3.4h, measured over 21 fires) AND
# disproportionately drop on-the-hour (:00) schedules during high-load
# windows (start of every hour) - GitHub's own docs call this out. That
# pattern showed up directly here: the tracker's single on-the-hour crons
# ('0 6', '0 13') kept landing reliably while the pipeline's crons went
# missing for 20+ hour stretches three separate times in five days
# (2026-08-26/27, 08-29/30, 08-30/31) - no pipeline-fetch cron landed at
# all in those windows, only the tracker's, which rebuilt the dashboard
# from stale data and made it look like the pipeline "ran" with the wrong
# date rather than not having run at all.
#
# Fix: pipeline-fetch crons moved off :00, staggered so they don't all
# queue at the same instant:
#   '0 13,15,17,19,21 * * *'  -> '7 13,15,17,19,21 * * *'
#   '0 16 * * *'              -> '23 16 * * *'
#   '0 21 * * *'              -> '41 21 * * *'
# TRANSITIONAL: the old :00 entries are kept below for now - cron
# (re)registration takes 24-48h to take effect, and dropping the :00
# entries immediately would leave a coverage gap until the new ones start
# firing. Remove the three '0 ...' pipeline entries once the staggered
# ones are confirmed landing (`gh run list --workflow=pipeline.yml` should
# show schedule-triggered runs at :07/:23/:41 past the hour) - both sets
# can coexist meanwhile, same as the original '0 16'/'0 21' transition.
#
# Tracker crons ('0 6', '0 13') are UNCHANGED - they've been landing
# reliably; only the pipeline-fetch crons showed the on-the-hour problem.

on:
  schedule:
    # TRANSITIONAL (added 2026-08-31) - remove once the staggered entries
    # below are confirmed firing. See CRON STRATEGY note above.
    - cron: '0 13,15,17,19,21 * * *'
    - cron: '0 16 * * *'
    - cron: '0 21 * * *'
    - cron: '7 13,15,17,19,21 * * *'  # Pipeline: 5 attempts 6 AM–2 PM PDT, staggered off :00 (smart-skip handles dedup)
    - cron: '23 16 * * *'             # Morning pipeline backup, staggered off :00
    - cron: '41 21 * * *'             # Afternoon pipeline backup, staggered off :00
    - cron: '0 6 * * *'               # Nightly tracker  — 11:00 PM PDT (primary) - unchanged, reliable
    - cron: '0 13 * * *'              # Backup tracker   —  6:00 AM PDT - unchanged, reliable
  workflow_dispatch:
    inputs:
      run_type:
        description: 'pipeline = morning/afternoon run | tracker = nightly grading'
        required: true
        default: 'pipeline'
        type: choice
        options:
          - pipeline
          - tracker

env:
  OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
  MLB_HEADLESS: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # pipeline takes up to 90 min on slow API days; hard-kill at 2 h

    permissions:
      contents: write
      actions: write    # required for gh workflow run pages.yml (workflow dispatch)

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Shared run date ──────────────────────────────────────────────────
      # Computed once, here, and reused by every later step (freshness
      # check, pipeline.py, projections.py, report.py, the commit step's
      # race check) instead of each recomputing `date -u` independently.
      # pipeline.py alone used to default to naive `datetime.now()` (no
      # --date was ever passed to it) while projections.py/report.py got an
      # explicit `$(date -u +%Y-%m-%d)` evaluated at THEIR step's start -
      # minutes to tens of minutes after pipeline.py began. A long fetch
      # (pipeline.py's healthy baseline is ~17 min, and it's run past 40+
      # on bad days) crossing UTC midnight could desync them: pipeline.py
      # writes to the old date, the later steps ask for the new date, and
      # data/{new date}.json doesn't exist. One shared value computed
      # before any step that can run long makes that impossible.
      - name: Compute run date
        id: rundate
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # ── Fresh-data check (pipeline crons only) ───────────────────────────
      # Sets skip=true if today's data file is <3h old. All pipeline steps
      # gate on this output so every-2h fires are free if data already exists.
      #
      # BUG FIXED 2026-08-27: this used to compare against `date -r "$DATA"`
      # (the file's mtime). actions/checkout resets every file's mtime to
      # checkout time, not its original commit time - so on a fresh runner
      # the file always reads as a few seconds old, and every fire after the
      # day's first successful fetch silently skipped regardless of how
      # stale the data actually was. Went unnoticed for a month because the
      # first fire of each UTC day still ran (file didn't exist yet), which
      # looked like the gate working.
      #
      # Fixed by reading the file's last commit timestamp via `git log`
      # instead of its mtime - immune to checkout, survives any runner.
      # (Considered stamping a generated_at field inside the data JSON
      # itself instead, which would be independent of git entirely, but
      # data/{date}.json is a bare list of player records - not an object -
      # consumed as such by projections.py/tracker.py/backtest.py/stacks.py.
      # Wrapping it in {"generated_at": ..., "players": [...]} would mean
      # updating every reader's schema for a freshness check that doesn't
      # need it. `git log` gets the same correctness with a one-line,
      # workflow-only change - checkout already uses fetch-depth: 0, so
      # full history is available.)

      - name: Check for fresh pipeline data
        id: freshness
        if: >-
          github.event.schedule == '0 13,15,17,19,21 * * *' ||
          github.event.schedule == '0 16 * * *' ||
          github.event.schedule == '0 21 * * *' ||
          github.event.schedule == '7 13,15,17,19,21 * * *' ||
          github.event.schedule == '23 16 * * *' ||
          github.event.schedule == '41 21 * * *' ||
          github.event.inputs.run_type == 'pipeline'
        run: |
          TODAY="${{ steps.rundate.outputs.today }}"
          DATA="data/${TODAY}.json"
          if [ -f "$DATA" ]; then
            COMMIT_TS=$(git log -1 --format=%ct -- "$DATA" 2>/dev/null)
            if [ -z "$COMMIT_TS" ]; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "Data for ${TODAY} exists but has no commit history (unexpected) — running pipeline."
            else
              AGE=$(( $(date +%s) - COMMIT_TS ))
              if [ "$AGE" -lt 10800 ]; then
                echo "skip=true"  >> "$GITHUB_OUTPUT"
                echo "Data for ${TODAY} is ${AGE}s old (<3h, by last commit) — skipping this fire."
              else
                echo "skip=false" >> "$GITHUB_OUTPUT"
                echo "Data for ${TODAY} is ${AGE}s old (>=3h, by last commit) — running pipeline."
              fi
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "No data for ${TODAY} yet — running pipeline."
          fi

      # ── Pipeline steps ───────────────────────────────────────────────────

      - name: Pipeline — fetch data
        if: >-
          steps.freshness.outputs.skip != 'true' && (
            github.event.schedule == '0 13,15,17,19,21 * * *' ||
            github.event.schedule == '0 16 * * *' ||
            github.event.schedule == '0 21 * * *' ||
            github.event.schedule == '7 13,15,17,19,21 * * *' ||
            github.event.schedule == '23 16 * * *' ||
            github.event.schedule == '41 21 * * *' ||
            github.event.inputs.run_type == 'pipeline'
          )
        run: |
          # NOTE: capture $? from a plain invocation, not from `if ! cmd`.
          # `$?` after `if ! cmd; then` reflects the negated/inverted status
          # (always 0 in this branch), not cmd's real exit code — that bug
          # let every pipeline.py crash (segfault or otherwise) get swallowed
          # as ec=0, so the step "succeeded" and downstream steps silently
          # rendered whatever stale data file was already on disk.
          #
          # Runtime canary: healthy baseline is ~17 min (confirmed 2026-07-19).
          # Warn past 45 min, kill and fail past 60 - grinding all the way to
          # GitHub's 2-hour job timeout (which happened twice on 2026-07-19,
          # once for real segfaults and once from a since-fixed subprocess
          # bug) wastes an hour-plus discovering what a fast failure would
          # have caught immediately. Past 60 min is structural breakage, not
          # normal slowness, and should fail loud rather than grind silently.
          #
          # TODAY comes from the "Compute run date" step, not a fresh
          # `date -u` here - pipeline.py used to default to naive
          # datetime.now() with no --date passed at all, computed whenever
          # the script happened to start. Passing the shared value
          # explicitly means this step, projections.py, and report.py all
          # agree on the same date even if this run crosses UTC midnight.
          TODAY="${{ steps.rundate.outputs.today }}"
          run_with_canary() {
            python pipeline.py --date "$TODAY" &
            local pid=$!
            local start=$(date +%s)
            local warned=false
            while kill -0 "$pid" 2>/dev/null; do
              sleep 30
              elapsed=$(( $(date +%s) - start ))
              if [ "$elapsed" -gt 3600 ]; then
                echo "::error::pipeline.py exceeded 60 min (healthy baseline ~17 min) - killing before GitHub's 2h hard timeout. This is structural breakage, not normal slowness."
                kill -9 "$pid" 2>/dev/null
                wait "$pid" 2>/dev/null
                return 124
              fi
              if [ "$elapsed" -gt 2700 ] && [ "$warned" = false ]; then
                echo "::warning::pipeline.py has been running $(( elapsed / 60 ))min (healthy baseline ~17 min) - past 45 min may indicate a stuck fetch."
                warned=true
              fi
            done
            wait "$pid"
            return $?
          }

          run_with_canary
          ec=$?
          if [ "$ec" -eq 139 ]; then
            echo "::warning::pipeline.py segfaulted (exit 139) - retrying once"
            run_with_canary
            ec=$?
          fi
          if [ "$ec" -ne 0 ] || [ ! -f "data/${TODAY}.json" ]; then
            echo "::error::pipeline.py did not produce data/${TODAY}.json (exit $ec) — failing so we don't rebuild the dashboard from yesterday's data."
            exit 1
          fi

      - name: Pipeline — generate projections
        if: >-
          steps.freshness.outputs.skip != 'true' && (
            github.event.schedule == '0 13,15,17,19,21 * * *' ||
            github.event.schedule == '0 16 * * *' ||
            github.event.schedule == '0 21 * * *' ||
            github.event.schedule == '7 13,15,17,19,21 * * *' ||
            github.event.schedule == '23 16 * * *' ||
            github.event.schedule == '41 21 * * *' ||
            github.event.inputs.run_type == 'pipeline'
          )
        run: python projections.py "${{ steps.rundate.outputs.today }}"

      - name: Pipeline — build dashboard
        if: >-
          steps.freshness.outputs.skip != 'true' && (
            github.event.schedule == '0 13,15,17,19,21 * * *' ||
            github.event.schedule == '0 16 * * *' ||
            github.event.schedule == '0 21 * * *' ||
            github.event.schedule == '7 13,15,17,19,21 * * *' ||
            github.event.schedule == '23 16 * * *' ||
            github.event.schedule == '41 21 * * *' ||
            github.event.inputs.run_type == 'pipeline'
          )
        run: python report.py "${{ steps.rundate.outputs.today }}"

      # ── Tracker step ─────────────────────────────────────────────────────

      - name: Tracker — grade today's results
        if: >-
          github.event.schedule == '0 6 * * *' ||
          github.event.schedule == '0 13 * * *' ||
          github.event.inputs.run_type == 'tracker'
        run: python tracker.py

      # ── Commit and push ──────────────────────────────────────────────────
      # gh workflow run pages.yml triggers the Pages deploy after every push.
      # '|| true' prevents a Pages-trigger failure from failing the whole job.

      - name: Commit and push all changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # ── Race check ──────────────────────────────────────────────────
          # Pipeline steps can take up to 90 min. If this run started when
          # today's data was stale/missing (skip=false) but another fire
          # finished and pushed today's data while we were working, our
          # regenerated files are redundant. Drop them and exit clean
          # instead of racing at push time below.
          if [ "${{ steps.freshness.outputs.skip }}" = "false" ]; then
            TODAY="${{ steps.rundate.outputs.today }}"
            git fetch origin main
            if git cat-file -e "origin/main:data/${TODAY}.json" 2>/dev/null; then
              echo "origin/main already has data/${TODAY}.json — another run finished first. Discarding local changes, no push needed."
              git checkout -- .
              git clean -fd
              exit 0
            fi
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed — no commit needed."
          else
            git commit -m "Pipeline run $(date -u +'%Y-%m-%d %H:%M UTC')"
            if ! git pull --rebase origin main; then
              echo "Rebase conflict — resolving by taking this run's generated version of every conflicting file."
              conflicts=$(git diff --name-only --diff-filter=U)
              for f in $conflicts; do
                git checkout --theirs -- "$f" 2>/dev/null && git add -- "$f" || git rm -f -- "$f"
              done
              git rebase --continue
            fi
            git push
            gh workflow run pages.yml || true
          fi
