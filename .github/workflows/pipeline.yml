name: MLB Fantasy Pipeline

# All cron times are UTC. The MLB season runs in PDT (UTC-7) Apr–Oct.
#
# CRON STRATEGY (updated 2026-09-03):
# ─────────────────────────────────────────────────────────────────────────────
# The 2026-08-31 fix (staggering pipeline-fetch crons off :00 to :07/:23/:41)
# did NOT work - confirmed by a week of `gh run list` data collected
# 2026-08-27 through 2026-09-03: the staggered entries dropped at the same
# rate as the :00 ones they replaced. Every single day in that window, the
# first fetch attempt(s) inside the intended 13:00-21:00 UTC (6am-2pm PDT)
# window were silently dropped, with the day's first REAL fetch often not
# landing until 17:00-18:00 UTC or later - sometimes not at all without a
# manual `workflow_dispatch`. This is GitHub's documented behavior (schedule
# events can be delayed or dropped under platform load, worse during
# high-traffic UTC hours) - it isn't specific to which minute the cron is
# set to, so staggering by a few minutes doesn't meaningfully dodge it.
#
# NEW STRATEGY: massively over-schedule instead of trying to dodge the
# problem with cleverer timing. The freshness gate below means a redundant
# fire (today's data already exists and is <3h old) costs only the
# "Check for fresh pipeline data" step - a few seconds - so firing every 20
# minutes across the whole failure-prone morning window is nearly free, and
# makes it statistically very unlikely for EVERY attempt to be dropped on
# the same day. 21 independent fires between 12:00-18:40 UTC (5am-11:40am
# PDT) replace the old 2-3 staggered attempts.
#
# SELF-HEALING: the tracker crons ('0 6', '0 13') have landed reliably all
# week (unlike the fetch crons) - see the "Check for fresh pipeline data"
# step, which now runs on EVERY trigger (not just pipeline-labeled ones) and
# gates the fetch/projections/dashboard steps purely on data freshness, not
# on which cron fired. A tracker fire that finds today's data missing now
# runs the full pipeline itself before grading, instead of just re-rendering
# the dashboard from yesterday's data (the exact bug fixed in report.py's
# regenerate_dashboard on 2026-09-02) - a reliable cron now covers for an
# unreliable one.
#
# DEADLINE ALERT: a separate `deadline_alert` job fires once at 17:00 UTC
# and posts to Discord if today's data still isn't fresh by then - a signal
# reachable from a phone, since the whole point of the redundant schedule
# above is not needing a human at a laptop to notice and manually trigger a
# run (which is what happened nearly every day this week otherwise).
#
# AFTERNOON/EVENING WINDOW (added 2026-09-15): the morning's dense schedule
# above ends at 18:40 UTC (~11:40am PDT); the two single-shot afternoon
# backups that used to be the only remaining coverage weren't enough -
# confirmed live 2026-09-15 that the day's last real fetch landed ~10:40am
# PT, the 12:41pm PT backup found data <3h old and correctly skipped (the
# freshness gate had no way to know lineups had since changed - see item 4
# in check_pipeline_freshness.py), and the 2:41pm PT backup never even
# shows up in the run history - silently dropped by GitHub's own scheduler,
# the exact documented reliability problem CRON STRATEGY above already
# covers for in the morning. Applying the SAME "massively over-schedule,
# let the freshness gate decide" strategy to the afternoon/evening:
# lineups are typically posted/updated 1-3h before first pitch and keep
# changing up to it, and MLB first pitches realistically run from ~10am PT
# (rare early day games, already inside the morning window) through
# ~7:15pm PT (latest West-coast night games) - 20-min fires from noon PT
# through ~9pm PT (a safety margin past the latest realistic first pitch)
# covers that with room either side. Two cron lines are needed since a
# single UTC hour range can't wrap past midnight, and both PDT/PST offsets
# are covered (their union, same reasoning as the soccer digest's dense-
# cron pattern) since the season can run close to the PDT/PST boundary:
#   PDT: noon-9pm PDT = 19:00-04:00 UTC (next day)
#   PST: noon-9pm PST = 20:00-05:00 UTC (next day)
#   union: 19:00-05:00 UTC -> the two lines below.
# check_pipeline_freshness.py is what keeps this cheap: a fire outside
# game hours, or one where every remaining game already has a confirmed
# lineup, exits in the same few seconds the morning window's redundant
# fires already do (see check_pipeline_freshness.py's own docstring) -
# this is the "runtime gate" that keeps a dense schedule affordable.

on:
  schedule:
    - cron: '*/20 12-18 * * *'  # Primary: 21 fires, 5am-11:40am PDT - see CRON STRATEGY above
    - cron: '*/20 19-23 * * *'  # Afternoon/evening part 1: noon PDT/PST-ish - see AFTERNOON/EVENING WINDOW above
    - cron: '*/20 0-4 * * *'    # Afternoon/evening part 2: wraps past midnight UTC - see AFTERNOON/EVENING WINDOW above
    - cron: '0 6 * * *'         # Nightly tracker  — 11:00 PM PDT (primary) - reliable all week
    - cron: '0 13 * * *'        # Backup tracker   —  6:00 AM PDT - reliable all week
    - cron: '0 17 * * *'        # Deadline-alert check only - see deadline_alert job below
  workflow_dispatch:
    inputs:
      run_type:
        description: 'pipeline = fetch/rebuild only | tracker = also grade (fetch still runs first if today''s data is missing/stale)'
        required: true
        default: 'pipeline'
        type: choice
        options:
          - pipeline
          - tracker

env:
  OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
  MLB_HEADLESS: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # pipeline takes up to 90 min on slow API days; hard-kill at 2 h

    permissions:
      contents: write
      actions: write    # required for gh workflow run pages.yml (workflow dispatch)

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Shared run date ──────────────────────────────────────────────────
      # Computed once, here, and reused by every later step (freshness
      # check, pipeline.py, projections.py, report.py, the commit step's
      # race check) instead of each recomputing `date -u` independently.
      # pipeline.py alone used to default to naive `datetime.now()` (no
      # --date was ever passed to it) while projections.py/report.py got an
      # explicit `$(date -u +%Y-%m-%d)` evaluated at THEIR step's start -
      # minutes to tens of minutes after pipeline.py began. A long fetch
      # (pipeline.py's healthy baseline is ~17 min, and it's run past 40+
      # on bad days) crossing UTC midnight could desync them: pipeline.py
      # writes to the old date, the later steps ask for the new date, and
      # data/{new date}.json doesn't exist. One shared value computed
      # before any step that can run long makes that impossible.
      # "today" MUST be the Pacific-anchored MLB baseball day, not a bare
      # UTC date (2026-09-14 fix) - UTC runs 7-8 hours ahead of Pacific,
      # so any trigger firing between ~17:00-23:59 PT (the nightly
      # tracker's self-healing re-fetch included) would otherwise compute
      # TOMORROW's date, silently fetch that day's schedule (real games,
      # zero lineups posted yet since they haven't happened), and persist
      # it as "today" - which reads exactly like the reported bug
      # (everyone stuck on "projected" despite real confirmed lineups
      # existing for the actual current Pacific day). See scrapers.
      # mlb_api.mlb_today_str, which every Python entry point uses for
      # this same reason - this step must stay in agreement with it.
      - name: Compute run date
        id: rundate
        run: |
          echo "today=$(TZ=America/Los_Angeles date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "run_start_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # ── Fresh-data check (every trigger, not just pipeline-labeled ones) ──
      # Runs unconditionally (changed 2026-09-03) - this is what makes the
      # tracker crons self-healing (see CRON STRATEGY above): a tracker fire
      # that finds today's data missing/stale sets skip=false exactly the
      # same way a pipeline fire would, so the fetch/projections/dashboard
      # steps below (gated purely on this output, not on which cron fired)
      # run the full pipeline before tracker.py grades anything.
      #
      # Logic lives in check_pipeline_freshness.py, not inline here - see
      # that file's own docstring for the two bugs this freshness check has
      # already gone through (mtime-reset, then a git-commit-timestamp trap
      # where a same-day rerun with unchanged output never advances the
      # "last commit" time, found 2026-09-04 the same day the dense retry
      # schedule shipped - "redundant fires are nearly free" was false in
      # practice until this was fixed, since every fire past 3h re-ran the
      # full ~15min fetch forever).

      - name: Check for fresh pipeline data
        id: freshness
        run: python3 check_pipeline_freshness.py

      # ── Pipeline steps ───────────────────────────────────────────────────

      - name: Pipeline — fetch data
        if: steps.freshness.outputs.skip != 'true'
        run: |
          # NOTE: capture $? from a plain invocation, not from `if ! cmd`.
          # `$?` after `if ! cmd; then` reflects the negated/inverted status
          # (always 0 in this branch), not cmd's real exit code — that bug
          # let every pipeline.py crash (segfault or otherwise) get swallowed
          # as ec=0, so the step "succeeded" and downstream steps silently
          # rendered whatever stale data file was already on disk.
          #
          # Runtime canary: healthy baseline is ~17 min (confirmed 2026-07-19).
          # Warn past 45 min, kill and fail past 60 - grinding all the way to
          # GitHub's 2-hour job timeout (which happened twice on 2026-07-19,
          # once for real segfaults and once from a since-fixed subprocess
          # bug) wastes an hour-plus discovering what a fast failure would
          # have caught immediately. Past 60 min is structural breakage, not
          # normal slowness, and should fail loud rather than grind silently.
          #
          # TODAY comes from the "Compute run date" step, not a fresh
          # `date -u` here - pipeline.py used to default to naive
          # datetime.now() with no --date passed at all, computed whenever
          # the script happened to start. Passing the shared value
          # explicitly means this step, projections.py, and report.py all
          # agree on the same date even if this run crosses UTC midnight.
          TODAY="${{ steps.rundate.outputs.today }}"
          run_with_canary() {
            python pipeline.py --date "$TODAY" &
            local pid=$!
            local start=$(date +%s)
            local warned=false
            while kill -0 "$pid" 2>/dev/null; do
              sleep 30
              elapsed=$(( $(date +%s) - start ))
              if [ "$elapsed" -gt 3600 ]; then
                echo "::error::pipeline.py exceeded 60 min (healthy baseline ~17 min) - killing before GitHub's 2h hard timeout. This is structural breakage, not normal slowness."
                kill -9 "$pid" 2>/dev/null
                wait "$pid" 2>/dev/null
                return 124
              fi
              if [ "$elapsed" -gt 2700 ] && [ "$warned" = false ]; then
                echo "::warning::pipeline.py has been running $(( elapsed / 60 ))min (healthy baseline ~17 min) - past 45 min may indicate a stuck fetch."
                warned=true
              fi
            done
            wait "$pid"
            return $?
          }

          run_with_canary
          ec=$?
          if [ "$ec" -eq 139 ]; then
            echo "::warning::pipeline.py segfaulted (exit 139) - retrying once"
            run_with_canary
            ec=$?
          fi
          if [ "$ec" -ne 0 ] || [ ! -f "data/${TODAY}.json" ]; then
            echo "::error::pipeline.py did not produce data/${TODAY}.json (exit $ec) — failing so we don't rebuild the dashboard from yesterday's data."
            exit 1
          fi

      - name: Pipeline — generate projections
        if: steps.freshness.outputs.skip != 'true'
        run: python projections.py "${{ steps.rundate.outputs.today }}"

      - name: Pipeline — build dashboard
        if: steps.freshness.outputs.skip != 'true'
        run: python report.py "${{ steps.rundate.outputs.today }}"

      # ── Tracker step ─────────────────────────────────────────────────────

      - name: Tracker — grade today's results
        if: >-
          github.event.schedule == '0 6 * * *' ||
          github.event.schedule == '0 13 * * *' ||
          github.event.inputs.run_type == 'tracker'
        run: python tracker.py

      # ── Commit and push ──────────────────────────────────────────────────
      # gh workflow run pages.yml triggers the Pages deploy after every push.
      # '|| true' prevents a Pages-trigger failure from failing the whole job.

      - name: Commit and push all changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # ── Race check ──────────────────────────────────────────────────
          # Pipeline steps can take up to 90 min, so two fires can
          # genuinely overlap. Logic lives in check_pipeline_race.py, not
          # inline here - see that file's docstring for why the original
          # "does data/{date}.json exist on origin?" version was wrong
          # (true for the rest of the day after the first fetch, so it
          # discarded every later-in-the-day refetch's work too, not just
          # a genuine race - found 2026-09-04 while validating the
          # freshness-marker fix in the same commit).
          if [ "${{ steps.freshness.outputs.skip }}" = "false" ]; then
            git fetch origin main
            if python3 check_pipeline_race.py "${{ steps.rundate.outputs.run_start_utc }}"; then
              git checkout -- .
              git clean -fd
              exit 0
            fi
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed — no commit needed."
          else
            git commit -m "Pipeline run $(date -u +'%Y-%m-%d %H:%M UTC')"

            # Push retry loop, added 2026-09-05: the race check above only
            # protects against a race THIS run can see at the moment it
            # checks - two runs that both pass that check within moments
            # of each other (confirmed live: run 33985378721 and
            # 33986103759 both started their commit step at 19:07:01,
            # neither saw the other's marker yet) can still collide at the
            # final `git push`, which fails outright with "[rejected] ...
            # fetch first" and no retry - the whole job then fails and
            # that run's real, freshly-fetched data is lost even though it
            # did nothing wrong. Denser scheduling makes this collision
            # more likely, not less, so it needs its own retry rather than
            # relying on the one-shot rebase-conflict handling below.
            PUSHED=false
            for attempt in 1 2 3 4 5; do
              if ! git pull --rebase origin main; then
                echo "Rebase conflict — resolving by taking this run's generated version of every conflicting file."
                conflicts=$(git diff --name-only --diff-filter=U)
                for f in $conflicts; do
                  git checkout --theirs -- "$f" 2>/dev/null && git add -- "$f" || git rm -f -- "$f"
                done
                git rebase --continue
              fi
              if git push; then
                PUSHED=true
                break
              fi
              echo "Push rejected (attempt ${attempt}/5) - another run landed first, retrying after a short backoff."
              sleep $(( attempt * 3 ))
            done
            if [ "$PUSHED" != "true" ]; then
              echo "::error::Failed to push after 5 attempts - persistent contention, not a one-off collision."
              exit 1
            fi
            gh workflow run pages.yml || true
          fi

  # ── Deadline alert ──────────────────────────────────────────────────────
  # Separate job (not a step in `run` above) so it can't be skipped by
  # anything the main job does and doesn't wait on/race with it - a
  # phone-reachable signal that the dense retry schedule above has, for
  # whatever reason, still not produced today's data by 17:00 UTC (10am
  # PDT), rather than the user discovering a stale dashboard on their own.
  # `if:` scopes this to its own dedicated cron only - every other trigger
  # (the dense fetch schedule, tracker crons, manual dispatch) skips it.
  # The actual check lives in check_pipeline_deadline.py (repo root) rather
  # than an inline heredoc - a YAML `run: |` block forces every line,
  # including a heredoc's own closing delimiter, to carry the step's
  # indentation, which a plain bash heredoc terminator can't match without
  # unreliable whitespace gymnastics. ubuntu-latest ships python3, so no
  # setup-python step is needed for a stdlib-only script.
  deadline_alert:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 17 * * *'
    timeout-minutes: 5

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Alert if today's data is still stale
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 check_pipeline_deadline.py
