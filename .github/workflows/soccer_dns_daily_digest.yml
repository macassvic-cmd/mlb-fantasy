name: Soccer DNS Daily Digest

# Full Dabble-driven Soccer DNS daily cycle (2026-09-14 production-
# scheduling work) - separate from the older soccer_dns.yml (the
# Betr-based hard injury detector, a different/older product). Flow:
# fresh Dabble fetch -> source enrichment -> DNS scoring -> persist
# snapshot -> real-time alert check -> Discord daily digest ->
# regenerate docs/soccer-dns.html -> commit & push. One call to
# soccer_daily_digest.run_daily_digest does the whole chain (see that
# module) so there is exactly one scoring pass per run, not one per step.
#
# THIS RUNS ON GITHUB'S OWN INFRASTRUCTURE, NOT A LOCAL MACHINE - the
# whole point of this workflow existing is that the digest no longer
# depends on any particular PC being turned on. The Dabble fetch itself
# uses scrapers/dabble_soccer_producer.py, a portable in-repo port of
# what used to be a Windows-only external script - see that module's
# docstring.
#
# TIMEZONE: GitHub Actions cron is UTC-only and does not observe DST.
# "7:00 AM America/Los_Angeles" is 14:00 UTC during PDT (summer) and
# 15:00 UTC during PST (winter). Both cron lines fire every day;
# `--if-due` (soccer_daily_digest.is_due_now) makes exactly ONE of the
# two actually run the full flow, and the other exits immediately as a
# harmless no-op - same "dense schedule + a runtime gate decides"
# discipline pipeline.yml already uses for the MLB pipeline, applied
# here specifically to survive the DST transition without drifting off
# 7am Pacific wall-clock time.

on:
  schedule:
    - cron: '0 14 * * *'  # 7:00 AM PDT (UTC-7, roughly Mar-Nov)
    - cron: '0 15 * * *'  # 7:00 AM PST (UTC-8, roughly Nov-Mar)
  workflow_dispatch:
    inputs:
      force:
        description: 'Resend even if already delivered today (manual runs only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Soccer DNS's own import chain (soccer_adapter/rotowire_soccer/
      # scrapers.*) only needs these - not the full MLB pipeline stack.
      - name: Install dependencies
        run: pip install requests beautifulsoup4 python-dotenv

      - name: Run Soccer DNS daily digest (fetch -> enrich -> score -> persist -> alerts -> Discord -> dashboard)
        env:
          PYTHONUNBUFFERED: '1'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_SOCCER_DNS_WEBHOOK_URL: ${{ secrets.DISCORD_SOCCER_DNS_WEBHOOK_URL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FORCE_FLAG=""
            if [ "${{ inputs.force }}" = "true" ]; then FORCE_FLAG="--force"; fi
            python soccer_dns.py --send-daily-digest $FORCE_FLAG
          else
            python soccer_dns.py --send-daily-digest --if-due
          fi

      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dns_watch/processed/soccer/ data/soccer_dnp_live_snapshots/ \
                  data/soccer_dns_alerts/ data/soccer_daily_digest/ \
                  data/rotowire_soccer_player_index.json data/rotowire_soccer_player_status_cache.json \
                  data/transfermarkt/ data/soccer_discord_health.json docs/soccer-dns.html
          if git diff --cached --quiet; then
            echo "No Soccer DNS changes this run (likely the --if-due no-op fire)."
          else
            git commit -m "Soccer DNS daily digest $(date -u +'%Y-%m-%d %H:%M UTC')"
            if ! git pull --rebase origin main; then
              echo "Rebase conflict - resolving by taking this run's version of state files."
              conflicts=$(git diff --name-only --diff-filter=U)
              for f in $conflicts; do
                git checkout --theirs -- "$f" 2>/dev/null && git add -- "$f" || git rm -f -- "$f"
              done
              git rebase --continue
            fi
            git push
          fi
