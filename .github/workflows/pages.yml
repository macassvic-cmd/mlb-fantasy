name: Deploy GitHub Pages

# Replaces the auto-generated "pages-build-deployment" legacy workflow.
# Requires Pages source set to "GitHub Actions" in repo Settings → Pages.
#
# The deploy step uses continue-on-error so a transient GitHub Pages
# infrastructure failure doesn't mark the whole run red.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Warn on transient deploy failure
        if: steps.deployment.outcome == 'failure'
        run: echo "::warning::Pages deploy failed (transient GitHub infrastructure error). Site not updated this run — will retry on next push."
